<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciar sesión en Veterinaria San Marcos.">
    <title>Iniciar Sesión — Veterinaria San Marcos</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container nav-wrapper">
            <a class="brand" href="index.html">
                <img class="brand-logo" src="Imagenes/Logo%20veterinaria.png" alt="Logo de Veterinaria San Marcos">
                <span>Veterinaria <strong>San Marcos</strong></span>
            </a>
            <nav class="main-nav" aria-label="Navegación principal">
                <a href="index.html#inicio">Inicio</a>
                <a href="catalogo.html">Catálogo</a>
                <div class="account-menu">
                    <button class="account-toggle" id="account-toggle" type="button" aria-haspopup="true"
                        aria-expanded="false" aria-controls="account-dropdown">
                        <span aria-hidden="true">👤</span> Mi cuenta <span class="chevron" aria-hidden="true">▾</span>
                    </button>
                    <div class="account-dropdown" id="account-dropdown" hidden>
                        <a href="login.html">Iniciar sesión</a>
                        <a href="registro.html">Registrarse</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="section auth-section">
            <div class="container auth-container">
                <div class="auth-card">
                    <p class="eyebrow">Acceso a la plataforma</p>
                    <h1>Iniciar Sesión</h1>
                    <p class="auth-subtitle">
                        Ingresa con tu correo institucional (<strong>@duoc.cl</strong>) registrado.
                    </p>

                    <form id="login-form" class="auth-form" novalidate>
                        <div class="form-group">
                            <label for="correo">Correo electrónico institucional</label>
                            <input id="correo" name="correo" type="email" placeholder="nombre.apellido@duoc.cl"
                                required>
                            <span class="field-error" id="error-correo"></span>
                        </div>

                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input id="password" name="password" type="password" required>
                            <span class="field-error" id="error-password"></span>
                        </div>

                        <button class="button" type="submit">Ingresar</button>
                        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

                        <div style="margin-top: 20px; font-size: 0.9rem; text-align: center;">
                            ¿Aún no tienes cuenta? <a href="registro.html"
                                style="color: var(--color-logo-dark); font-weight: bold;">Regístrate aquí</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/nav.js"></script>
    <script src="assets/js/login.js"></script>
</body>

</html>
