<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Regístrate en Veterinaria San Marcos para agendar consultas y comprar productos.">
    <title>Registro — Veterinaria San Marcos</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Mismo header que index.html, para mantener la navegación consistente entre páginas. -->
    <header class="site-header">
        <div class="container nav-wrapper">
            <a class="brand" href="index.html">
                <img class="brand-logo" src="Imagenes/Logo%20veterinaria.png" alt="Logo de Veterinaria San Marcos">
                <span>Veterinaria <strong>San Marcos</strong></span>
            </a>
            <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="mobile-nav">
                <span class="nav-toggle-line"></span>
                <span class="nav-toggle-line"></span>
                <span class="nav-toggle-line"></span>
            </button>
            <nav class="main-nav" id="mobile-nav" aria-label="Navegación principal">
                <a href="index.html#inicio">Inicio</a>
                <a href="catalogo.html">Catálogo</a>
                <div class="account-menu">
                    <button class="account-toggle" id="account-toggle" type="button" aria-haspopup="true"
                        aria-expanded="false" aria-controls="account-dropdown">
                        <span aria-hidden="true"></span> Mi cuenta <span class="chevron" aria-hidden="true">▾</span>
                    </button>
                    <div class="account-dropdown" id="account-dropdown" hidden>
                        <a href="login.html">Iniciar sesión</a>
                        <a href="registro.html">Registrarse</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="section auth-section">
            <div class="container auth-container">
                <div class="auth-card">
                    <p class="eyebrow">Crear cuenta</p>
                    <h1>Regístrate</h1>
                    <p class="auth-subtitle">
                        Solo pueden registrarse correos del dominio institucional
                        <strong>@duoc.cl</strong>, y se requiere ser mayor de 14 años.
                    </p>

                    <!-- novalidate: apagamos la validación nativa del navegador para controlar
                         nosotros el orden y el texto de cada error con JavaScript. -->
                    <form id="registro-form" class="auth-form" novalidate>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="nombre">Nombre (*)</label>
                                <input id="nombre" name="nombre" type="text" required>
                                <span class="field-error" id="error-nombre"></span>
                            </div>
                            <div class="form-group">
                                <label for="apellido">Apellido (*)</label>
                                <input id="apellido" name="apellido" type="text" required>
                                <span class="field-error" id="error-apellido"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="fecha-nacimiento">Fecha de nacimiento (*)</label>
                            <input id="fecha-nacimiento" name="fechaNacimiento" type="date" required>
                            <span class="field-error" id="error-fecha-nacimiento"></span>
                        </div>

                        <div class="form-group">
                            <label for="correo">Correo electrónico institucional (*)</label>
                            <input id="correo" name="correo" type="email" placeholder="nombre.apellido@duoc.cl"
                                required>
                            <span class="field-error" id="error-correo"></span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="password">Contraseña (*)</label>
                                <input id="password" name="password" type="password" required>
                                <!-- Aviso permanente del formato exigido, no solo un error post-envío. -->
                                <span class="field-hint">Mínimo 8 caracteres, con al menos 1 mayúscula y 1
                                    número.</span>
                                <span class="field-error" id="error-password"></span>
                            </div>
                            <div class="form-group">
                                <label for="confirmar-password">Confirmar contraseña (*)</label>
                                <input id="confirmar-password" name="confirmarPassword" type="password" required>
                                <span class="field-error" id="error-confirmar-password"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="direccion">Dirección (*)</label>
                            <input id="direccion" name="direccion" type="text" required>
                            <span class="field-error" id="error-direccion"></span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="region">Región (*)</label>
                                <select id="region" name="region" required>
                                    <option value="" selected disabled>Selecciona tu región</option>
                                    <option>Arica y Parinacota</option>
                                    <option>Tarapacá</option>
                                    <option>Antofagasta</option>
                                    <option>Atacama</option>
                                    <option>Coquimbo</option>
                                    <option>Valparaíso</option>
                                    <option>Metropolitana de Santiago</option>
                                    <option>Libertador General Bernardo O'Higgins</option>
                                    <option>Maule</option>
                                    <option>Ñuble</option>
                                    <option>Biobío</option>
                                    <option>La Araucanía</option>
                                    <option>Los Ríos</option>
                                    <option>Los Lagos</option>
                                    <option>Aysén del General Carlos Ibáñez del Campo</option>
                                    <option>Magallanes y de la Antártica Chilena</option>
                                </select>
                                <span class="field-error" id="error-region"></span>
                            </div>
                            <div class="form-group">
                                <label for="genero">Género (*)</label>
                                <select id="genero" name="genero" required>
                                    <option value="" selected disabled>Selecciona una opción</option>
                                    <option>Femenino</option>
                                    <option>Masculino</option>
                                    <option>No binario</option>
                                    <option>Prefiero no decirlo</option>
                                </select>
                                <span class="field-error" id="error-genero"></span>
                            </div>
                        </div>

                        <div class="form-group form-group--checkbox">
                            <label class="checkbox-label">
                                <input id="acepta-condiciones" name="aceptaCondiciones" type="checkbox" required>
                                <span>Acepto las condiciones de registro y el tratamiento de mis datos.</span>
                            </label>
                            <span class="field-error" id="error-acepta-condiciones"></span>
                        </div>

                        <button class="button" type="submit">Crear cuenta</button>
                        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/nav.js"></script>
    <script src="assets/js/registro.js"></script>
</body>

</html>
